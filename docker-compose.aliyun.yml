services:
  mysql:
    image: mysql:8
    container_name: smarthr-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=60
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: smarthr
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - smarthr-network

  redis:
    image: redis:7-alpine
    container_name: smarthr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    networks:
      - smarthr-network

  chroma:
    image: chromadb/chroma:0.5.0
    platform: linux/amd64
    container_name: smarthr-chroma
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "False"
    expose:
      - "8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    networks:
      - smarthr-network

  java-backend:
    build: ./smarthr-java
    container_name: smarthr-java
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smarthr?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      AI_SERVICE_URL: http://python-backend:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -XX:+ExitOnOutOfMemoryError"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 900m
    networks:
      - smarthr-network

  python-backend:
    build: ./smarthr-python
    container_name: smarthr-python
    restart: unless-stopped
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: smarthr
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      EMBEDDING_PROVIDER: local_bge
      LOCAL_BGE_MODEL_PATH: /opt/smarthr/models/bge-base-zh-v1.5
      EMBEDDING_MODEL: bge-base-zh-v1.5
      EMBEDDING_DIMENSIONS: 768
      ALLOW_MOCK_EMBEDDING: "false"
      RERANK_PROVIDER: hybrid
      EXPOSE_INTERNAL_RAG_TOOLS: "false"
      RAGAS_MODE: ${RAGAS_MODE:-heuristic}
    expose:
      - "8001"
    volumes:
      - /opt/smarthr/models:/opt/smarthr/models:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    mem_limit: 1400m
    networks:
      - smarthr-network

  frontend:
    build: ./smarthr-frontend
    container_name: smarthr-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - java-backend
      - python-backend
    mem_limit: 128m
    networks:
      - smarthr-network

  reverse-proxy:
    image: nginx:alpine
    container_name: smarthr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.aliyun.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./smarthr-java/uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - frontend
      - java-backend
      - python-backend
    mem_limit: 128m
    networks:
      - smarthr-network

volumes:
  mysql_data:
  redis_data:
  chroma_data:

networks:
  smarthr-network:
    driver: bridge
