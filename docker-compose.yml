version: '3.8'

services:
  # ==================== Database & Cache ====================
  mysql:
    image: mysql:8
    container_name: smarthr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: smarthr
      MYSQL_USER: ${MYSQL_USER:-smarthr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smarthr123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthr-network

  redis:
    image: redis:7-alpine
    container_name: smarthr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthr-network

  chroma:
    image: chromadb/chroma:0.4.15
    platform: linux/amd64
    container_name: smarthr-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smarthr-network

  # ==================== Backend Services ====================
  java-backend:
    build: ./smarthr-java
    container_name: smarthr-java
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smarthr?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-smarthr}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-smarthr123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-smarthr-secret-key-change-in-production}
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smarthr-network

  python-backend:
    build: ./smarthr-python
    container_name: smarthr-python
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-smarthr}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smarthr123}
      DB_NAME: smarthr
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - smarthr-network

  # ==================== Frontend + Nginx ====================
  frontend:
    build: ./smarthr-frontend
    container_name: smarthr-frontend
    ports:
      - "80:80"
    depends_on:
      - java-backend
      - python-backend
    networks:
      - smarthr-network

volumes:
  mysql_data:
  redis_data:
  chroma_data:

networks:
  smarthr-network:
    driver: bridge