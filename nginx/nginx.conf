events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream backends
    upstream java_backend {
        server java-backend:8080;
        keepalive 32;
    }

    # Frontend static files
    upstream frontend {
        server frontend:80;
    }

    # 说明：Python AI 服务不对外暴露，仅由 Java 通过 Docker 内网访问，
    # 因此不再定义 python_backend upstream / /python/ 反代。

    # Main server
    server {
        listen 80;
        server_name _;

        # Vue Router history mode - serve index.html for SPA
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Java business API
        location /api/ {
            proxy_pass http://java_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Python AI 服务不再经 Nginx 对外暴露：前端只调用 /api/（Java 网关），
        # Java 通过 Docker 内网 (python-backend:8001) 访问 Python，
        # 删除 /python/ 反代以避免外部绕过 Java 鉴权直连无鉴权的 Python 接口。

        # Uploaded files：不再通过 Nginx 静态目录公开暴露简历等上传文件（含候选人隐私）。
        # 如需下载，请新增带鉴权与归属校验的 Java 接口（如 /api/resumes/{id}/download）。

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
