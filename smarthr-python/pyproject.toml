[tool.poetry]
name = "smarthr-python"
version = "1.0.0"
description = "SmartHR Multi-Agent Recruitment Platform - Python AI Service"
authors = ["SmartHR Team"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.1"
uvicorn = {extras = ["standard"], version = "^0.47.0"}
langchain = "^1.3.1"
langchain-community = "^0.4.0"
langchain-openai = "^1.2.2"
langgraph = "^1.2.1"
chromadb = "^0.5.0"
openai = "^2.38.0"
python-multipart = "^0.0.29"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"
python-dotenv = "^1.2.2"
pypdf2 = "^3.0.1"
python-docx = "^1.2.0"
redis = "^7.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
