version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: smarthr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: smarthr
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthr-network

  redis:
    image: redis:7-alpine
    container_name: smarthr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthr-network

  chroma:
    image: chromadb/chroma:0.4.15
    platform: linux/amd64
    container_name: smarthr-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - smarthr-network

  frontend:
    build: ./smarthr-frontend
    container_name: smarthr-frontend
    ports:
      - "80:80"
    depends_on:
      - mysql
      - redis
    networks:
      - smarthr-network

volumes:
  mysql_data:
  redis_data:
  chroma_data:

networks:
  smarthr-network:
    driver: bridge